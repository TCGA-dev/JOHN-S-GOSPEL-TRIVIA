
name: Build John's Gospel Trivia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        id: extract
        run: |
          mkdir -p app
          unzip -q john_gospel_trivia_flutter_project.zip -d app

          PUBSPEC=$(find app -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Build Android APK
        run: flutter build apk --release
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Prepare APK
        run: |
          cp "${{ steps.extract.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk" john-gospel-trivia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: john-gospel-trivia-apk
          path: john-gospel-trivia.apk
